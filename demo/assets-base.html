<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pdfjs-viewer-element | Assets base demo</title>
    <script type="module" src="../dist/pdfjs-viewer-element.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>

  <body>
    <!--
      `assets-base` points at a folder holding the package `dist` files: the runtime files
      (viewer.mjs, pdf.mjs, pdf.worker.min.mjs, pdf.renderer.min.mjs, viewer.css, paper-and-ink.css)
      and the PDF.js data folders. Bundlers emit the runtime files but not the data, so bundled
      apps point it at a copy of `dist`, unless they use the Vite plugin (see vite-plugin/). It can
      also point at a CDN. Here it simply points back at `dist` for demonstration.
    -->
    <pdfjs-viewer-element
      src="/public/sample-pdf-with-images.pdf"
      assets-base="../dist/"
      style="height: 100dvh">
    </pdfjs-viewer-element>
  </body>
</html>
